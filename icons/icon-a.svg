      <stop offset="40%"  stop-color="#3DDC97" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="2.6" fill="#8FD8C6" fill-opacity="0.09"/>
