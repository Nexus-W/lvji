  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#dots)"/>

  <path d="M212 806 C 356 762, 322 574, 490 536 C 658 498, 672 340, 800 272"
        fill="none" stroke="url(#route)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="800" cy="272" r="86" fill="url(#glow)"/>
  <circle cx="800" cy="272" r="34" fill="#3DDC97"/>
