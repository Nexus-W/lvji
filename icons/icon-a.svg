<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#151E28"/>
      <stop offset="100%" stop-color="#080D12"/>
    </radialGradient>

    <linearGradient id="route" x1="212" y1="806" x2="800" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3DDC97" stop-opacity="0.30"/>
      <stop offset="50%"  stop-color="#3DDC97" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="glow">
