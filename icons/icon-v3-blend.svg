<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="b3" cx="52%" cy="44%" r="74%">
      <stop offset="0%" stop-color="#151E28"/>
      <stop offset="100%" stop-color="#080D12"/>
    </radialGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1C404E"/>
      <stop offset="100%" stop-color="#0B1720"/>
    </linearGradient>
    <clipPath id="c3"><rect x="212" y="352" width="440" height="326" rx="30"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#b3)"/>

  <!-- 后一张照片：露出边缘，形成堆叠 -->
  <g transform="rotate(-13 432 516)">
    <rect x="212" y="352" width="440" height="326" rx="30"
          fill="#0D161F" stroke="#263D4B" stroke-width="6"/>
  </g>

  <!-- 前一张照片：山景 -->
  <g transform="rotate(-6 432 516)">
    <rect x="212" y="352" width="440" height="326" rx="30" fill="url(#sky3)"
          stroke="#3C5768" stroke-width="6"/>
    <g clip-path="url(#c3)">
      <circle cx="306" cy="440" r="26" fill="#3DDC97" fill-opacity="0.85"/>
      <path d="M244 630 L344 524 L410 586 L482 500 L606 630"
            fill="none" stroke="#3DDC97" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    </g>

    <!-- 右上角的书签角标：照片被「收藏」了 -->
    <path d="M596 352 L652 352 L652 438 L624 414 L596 438 Z" fill="#3DDC97"/>
  </g>
</svg>
