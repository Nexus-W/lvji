<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>坐标补救</title>
<link rel="stylesheet" href="scenes.css">
<style>
  :root{
    --bg:#05080B; --panel:#0F141B; --panel2:#141A23; --line:#232C39;
    --t1:#E9EEF6; --t2:#8C97A9; --t3:#5C6675;
    --accent:#3DDC97; --warn:#FFB454; --info:#6C8CFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--t1);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  .stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 0}
  .device{height:min(880px,92vh);aspect-ratio:420/880;border-radius:40px;overflow:hidden;
    border:1px solid #2A3341;background:#0A0F14;position:relative;
    box-shadow:0 40px 90px -40px #000,0 0 0 7px #05080B}
  .app{height:100%;display:flex;flex-direction:column;background:var(--panel)}

  .head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 16px;
    border-bottom:1px solid var(--line)}
  .back{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;
    color:var(--t2);font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;flex:0 0 32px}
  .back:active{color:var(--accent);border-color:rgba(61,220,151,.5)}
  .ht{flex:1;min-width:0}
  .ht b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ht span{display:block;font-size:9px;color:var(--t3);margin-top:4px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--t2);font-size:12px;display:flex;align-items:center;justify-content:center}

  /* 说明条 */
  .banner{position:relative;margin:12px 16px 0;padding:12px 32px 12px 12px;border-radius:11px;flex:0 0 auto;
    background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.28)}
  .banner .t{font-size:12px;color:#FFD9A8;font-weight:600}
  .banner .s{font-size:9px;color:rgba(255,217,168,.62);line-height:1.7;margin-top:4px}
  .tipx{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;color:rgba(255,217,168,.75);
    font-size:15px;line-height:1;cursor:pointer;transition:background .15s,color .15s}
  .tipx:hover{background:rgba(255,180,84,.18);color:#FFD9A8}

  /* 筛选标签（从 C1 搬过来的） */
  .chips{display:flex;gap:8px;padding:12px 16px 8px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);
    color:var(--t2);white-space:nowrap;flex:0 0 auto;cursor:pointer;transition:background .16s,color .16s,border-color .16s}
  .chip.on{background:var(--t1);color:#0A0F14;border-color:var(--t1);font-weight:700}
  .chip.warn{border-color:rgba(255,180,84,.4);color:var(--warn);background:rgba(255,180,84,.07)}
  .chip.warn.on{background:var(--warn);color:#1A1206;border-color:var(--warn)}
  .chip i{font-style:normal}

  .scroll{flex:1;overflow-y:auto;position:relative;scrollbar-width:none;padding:0 16px}
  .scroll::-webkit-scrollbar{display:none}

  /* 时钟校正 */
  .clock{border-radius:12px;background:var(--panel2);border:1px solid var(--line);
    padding:12px;margin-bottom:16px}
  .clock .row{display:flex;align-items:center;gap:8px}
  .clock .row .lbl{font-size:12px;font-weight:600}
  .clock .row .tag{margin-left:auto;font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;
    background:rgba(255,180,84,.16);color:var(--warn)}
  .clock input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
    background:#20293A;outline:none;margin:16px 0 8px}
  .clock input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .clock .scale{display:flex;justify-content:space-between;font-size:9px;color:var(--t3)}
  .clock .chint{font-size:9px;color:var(--t2);margin-top:8px}
  .clock .chint b{color:var(--accent);font-weight:700}

  /* 分组 */
  .group{margin-bottom:8px}
  .gh{display:flex;align-items:center;gap:8px;padding:8px 2px 8px;font-size:12px;font-weight:600}
  .gh .n{font-size:9px;color:var(--t3);font-weight:400}
  .gh .bar{flex:1;height:1px;background:var(--line)}

  .item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(35,44,57,.55)}
  .ck{width:16px;height:16px;border-radius:5px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
    border:1.4px solid #33404F;font-size:12px;font-weight:700;color:#04170F;cursor:pointer;transition:background .15s,border-color .15s}
  .ck.on{background:var(--accent);border-color:var(--accent)}
  .thumb{width:38px;height:38px;border-radius:7px;flex:0 0 38px;position:relative;overflow:hidden}
  .thumb video{display:none}
  .thumb .vb{position:absolute;left:3px;top:3px;font-size:9px;background:rgba(108,140,255,.92);color:#fff;
    padding:1px 4px;border-radius:3px;z-index:2}
  .meta{flex:1;min-width:0}
  .meta .f{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .s{font-size:9px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .s em{font-style:normal;color:var(--warn)}
  .act{font-size:9px;font-weight:700;padding:4px 8px;border-radius:5px;white-space:nowrap;
    border:1px solid rgba(61,220,151,.45);color:var(--accent);background:rgba(61,220,151,.08);cursor:pointer}
  .act.manual{border-color:var(--line);color:var(--t2);background:transparent}

  .more{text-align:center;font-size:12px;color:var(--t3);padding:16px 0 8px}

  /* 单张设置坐标 */
  .modal{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(3,6,9,.86);backdrop-filter:blur(6px);padding:16px}
  .modal.show{display:flex}
  .mcard{width:100%;border-radius:16px;overflow:hidden;background:var(--panel2);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 60px -20px #000}
  .mhead{display:flex;align-items:center;padding:12px 16px;font-size:12px;font-weight:600;
    border-bottom:1px solid var(--line)}
  .mhead .mc{margin-left:auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;color:var(--t3);font-size:15px;line-height:1;cursor:pointer}
  .mhead .mc:hover{background:rgba(255,255,255,.06);color:var(--t1)}
  .mnear{padding:6px 16px 0;font-size:12px;color:var(--accent);min-height:16px}
  .msearch{position:relative;padding:10px 14px 0}
  .msearch input{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--t1);font-size:12px;padding:0 10px;
    font-family:inherit;outline:none}
  .msearch input:focus{border-color:rgba(61,220,151,.45)}
  .mres{position:absolute;left:14px;right:14px;top:48px;z-index:6;display:none;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mres.show{display:block}
  .mres div{padding:9px 12px;font-size:12px;color:var(--t2);cursor:pointer}
  .mres div:active{background:rgba(255,255,255,.06);color:var(--t1)}

  .mmap{position:relative;height:176px;background:#07100F;overflow:hidden;cursor:crosshair;
    border-bottom:1px solid var(--line)}
  .mmap svg{display:block;width:100%;height:100%}
  .mpin{position:absolute;width:22px;height:22px;margin:-12px 0 0 -12px;border-radius:50%;
    border:2px solid #fff;background:rgba(61,220,151,.35);box-shadow:0 0 0 4px rgba(61,220,151,.18);
    pointer-events:none;display:none}
  .mpin.show{display:block}
  .mmap .mtip{position:absolute;left:8px;bottom:7px;font-size:9px;color:rgba(200,220,230,.6);
    background:rgba(5,8,11,.62);padding:2px 8px;border-radius:5px;pointer-events:none}
  .mrow{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;color:var(--t3)}
  .mrow b{margin-left:auto;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
  .mbtns{display:flex;gap:8px;padding:4px 16px 16px}
  .mbtns button{flex:1;height:36px;border-radius:10px;border:none;font-family:inherit;
    font-size:12px;font-weight:600;cursor:pointer}
  .mbtns .ghost{background:transparent;border:1px solid var(--line);color:var(--t2)}
  .mbtns .ok{background:var(--accent);color:#04170F;font-weight:700}

  /* 大图模式 */
  .lb.show{display:flex}

  .footer{flex:0 0 auto;padding:8px 16px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .btn{height:42px;border-radius:12px;background:var(--accent);color:#04170F;font-size:12px;
    font-weight:700;display:flex;align-items:center;justify-content:center;border:none;width:100%;
    font-family:inherit;cursor:pointer}
  .btn:active{filter:brightness(.92)}
  .foot-note{text-align:center;font-size:9px;color:var(--t3);margin-top:8px}

  .hint{font-size:12px;color:#4E5866;text-align:center;padding:0 16px}
  @media(max-width:780px){
    .stage{padding:0;gap:0}
    .device{height:100vh;width:100vw;aspect-ratio:auto;border-radius:0;border:none;box-shadow:none}
    .hint{display:none}
  }
</style>
<script src="theme.js"></script>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="app">

      <div class="head">
        <a class="back" href="timeline-page.html" data-back="timeline-page.html">‹</a>
        <div class="ht">
          <b>坐标补救</b>
          <span id="rMeta">—</span>
        </div>
        <div class="hbtn">?</div>
      </div>

      <div class="banner" id="banner">
        <span class="tipx" id="tipx" title="不再提醒">×</span>
        <div class="t">Action 5 Pro 机身没有 GPS 模块</div>
        <div class="s">单机拍摄的照片无法写入坐标。可用同一时段的手机照片，按拍摄时间推算位置。</div>
      </div>

      <div class="chips" id="chips">
        <span class="chip on" data-f="all">全部 <i id="cAll">0</i></span>
        <span class="chip" data-f="photo">照片 <i id="cPhoto">0</i></span>
        <span class="chip" data-f="video">视频 <i id="cVideo">0</i></span>
        <span class="chip warn" data-f="none">无参照 <i id="cNone">0</i></span>
      </div>

      <div class="scroll" id="scroll">
        <div class="clock">
          <div class="row">
            <div class="lbl">设备时钟校正</div>
            <div class="tag">已识别偏差 +12 分钟</div>
          </div>
          <input type="range" id="rng" min="-60" max="60" step="1" value="12">
          <div class="scale"><span>-60 分</span><span>0</span><span>+60 分</span></div>
          <div class="chint">调整后：可推断素材 <b><span id="base">0</span> → <span id="cnt">0</span></b> 张</div>
        </div>

        <div class="group" id="gInfer">
          <div class="gh">可推断 <span class="n" id="nInfer">280 张</span><span class="bar"></span></div>
          <div id="listInfer"></div>
        </div>

        <div class="group" id="gNone">
          <div class="gh">无参照 <span class="n" id="nNone">32 张</span><span class="bar"></span></div>
          <div id="listNone"></div>
        </div>

        <div class="more" id="more">还有 298 条 · 展开全部</div>
      </div>

      <div class="footer">
        <button class="btn" id="apply">采纳 0 张建议位置</button>
        <div class="foot-note">不改动原文件，只写入本地索引库</div>
      </div>

    </div>

    <div class="modal" id="modal">
      <div class="mcard">
        <div class="mhead">设置坐标<span class="mc" id="mclose">×</span></div>
        <div class="msearch">
          <input id="msearch" type="text" placeholder="搜索地点，如「双廊」" autocomplete="off">
          <div class="mres" id="mres"></div>
        </div>
        <div class="mmap" id="mmap">
          <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="1000" height="1000" fill="#08131A"/>
            <g fill="#0E242B" stroke="rgba(120,190,200,.10)" stroke-width="1.5">
              <path d="M-60 110 C 120 30, 300 60, 420 150 C 520 226, 470 330, 360 372 C 250 414, 80 392, -30 300 Z"/>
              <path d="M700 -50 C 870 10, 1000 120, 970 270 C 946 396, 820 430, 720 366 C 616 300, 612 110, 700 -50 Z"/>
              <path d="M-70 620 C 100 560, 265 595, 345 700 C 428 808, 360 908, 215 946 C 80 980, -50 890, -70 620 Z"/>
            </g>
            <path d="M556 246 C 640 276, 692 382, 670 502 C 650 616, 578 686, 518 664 C 458 642, 438 540, 454 442 C 470 344, 498 226, 556 246 Z"
                  fill="#0B2A34" stroke="rgba(90,200,215,.25)" stroke-width="2"/>
            <g fill="none" stroke="rgba(200,222,232,.12)" stroke-width="3">
              <path d="M30 830 C 190 770, 320 706, 432 642 S 604 520, 700 432"/>
              <path d="M110 190 C 246 296, 372 420, 466 556 S 556 762, 618 906"/>
            </g>
            <g fill="rgba(200,225,232,.42)" font-size="26" font-family="sans-serif">
              <text x="246" y="782">大理</text><text x="586" y="486">洱海</text><text x="690" y="438">双廊</text>
            </g>
          </svg>
          <div class="mpin" id="mpin"></div>
          <div class="mtip">点一下地图，放置这张照片的位置</div>
        </div>
        <div class="mrow"><span>文件</span><b id="mfile">—</b></div>
        <div class="mrow"><span>坐标</span><b id="mcoord">未设置</b></div>
        <div class="mnear" id="mnear"></div>
        <div class="mbtns">
          <button class="ghost" id="mcancel">取消</button>
          <button class="ok" id="mok">保存</button>
        </div>
      </div>
    </div>

  </div>

  <p class="hint">坐标补救 · 筛选标签已从地图页移到这里 · 左上角返回</p>
</div>

<script src="data.js"></script>
<script src="lightbox.js"></script>
<script>
(function(){
  'use strict';

  var SC = ['a','b','c','d','e','f','g','h'];
  var GRAD = {
    a:'linear-gradient(150deg,#2C5A6B,#162A36)', b:'linear-gradient(150deg,#6E5B39,#2C2719)',
    c:'linear-gradient(150deg,#3B4870,#191E2F)', d:'linear-gradient(150deg,#486B58,#1B2C25)',
    e:'linear-gradient(150deg,#6B4757,#2C1B22)', f:'linear-gradient(150deg,#57697A,#212B34)',
    g:'linear-gradient(150deg,#7A6A46,#332C1E)', h:'linear-gradient(150deg,#356B6B,#16292A)'
  };

  var INFER = [
    {f:'DJI_0284.MP4', t:'14:32:05', type:'video', at:'洱海东岸', sel:true},
    {f:'DJI_0285.JPG', t:'14:36:11', type:'photo', at:'洱海东岸', sel:true},
    {f:'DJI_0286.JPG', t:'14:39:02', type:'photo', at:'洱海东岸', sel:true},
    {f:'DJI_0290.MP4', t:'15:12:44', type:'video', at:'双廊镇口', sel:true},
    {f:'DJI_0291.JPG', t:'15:18:30', type:'photo', at:'双廊镇口', sel:true},
    {f:'DJI_0295.JPG', t:'16:02:11', type:'photo', at:'环海西路', sel:true},
    {f:'DJI_0296.JPG', t:'16:05:48', type:'photo', at:'环海西路', sel:true},
    {f:'DJI_0299.MP4', t:'16:41:03', type:'video', at:'小普陀', sel:true},
    {f:'DJI_0300.JPG', t:'16:45:22', type:'photo', at:'小普陀', sel:true},
    {f:'DJI_0304.JPG', t:'17:20:09', type:'photo', at:'挖色', sel:true}
  ];

  var NONE = [
    {f:'DJI_0301.JPG', t:'次日 08:02', type:'photo', at:'', sel:false},
    {f:'DJI_0312.JPG', t:'次日 09:16', type:'photo', at:'', sel:false},
    {f:'DJI_0318.MP4', t:'次日 11:40', type:'video', at:'', sel:false},
    {f:'DJI_0325.JPG', t:'次日 14:05', type:'photo', at:'', sel:false}
  ];

  var chipEls = document.querySelectorAll('#chips .chip');
  var listInfer = document.getElementById('listInfer');
  var listNone = document.getElementById('listNone');
  var gInfer = document.getElementById('gInfer');
  var gNone = document.getElementById('gNone');
  var applyBtn = document.getElementById('apply');
  var rng = document.getElementById('rng');
  var cntEl = document.getElementById('cnt');

  function thumbHtml(item, i){
    var g = GRAD[SC[i % SC.length]];
    var v = item.type === 'video' ? '<span class="vb">视频</span>' : '';
    return '<div class="thumb" style="background:' + g + '">' + v + '</div>';
  }

  function renderItems(el, arr, offset){
    var h = '';
    arr.forEach(function(item, i){
      h += '<div class="item" data-type="' + item.type + '" data-sel="' + (item.sel ? '1' : '0') + '">';
      h += '<span class="ck' + (item.sel ? ' on' : '') + '">' + (item.sel ? '✓' : '') + '</span>';
      h += thumbHtml(item, i + offset);
      h += '<div class="meta"><div class="f">' + item.f + '</div>';
      h += '<div class="s">' + item.t + ' · ' + (item.at ? item.at : '<em>无参照</em>') + '</div></div>';
      h += '<span class="act' + (item.at ? '' : ' manual') + '">修改</span>';
      h += '</div>';
    });
    el.innerHTML = h;
  }

  renderItems(listInfer, INFER, 0);
  renderItems(listNone, NONE, 3);

  function currentFilter(){
    for(var i = 0; i < chipEls.length; i++){
      if(chipEls[i].classList.contains('on')) return chipEls[i].dataset.f;
    }
    return 'all';
  }

  function applyRemedyFilter(){
    var f = currentFilter();
    var rows = document.querySelectorAll('#scroll .item');
    for(var i = 0; i < rows.length; i++){
      var t = rows[i].dataset.type;
      var show = (f === 'all') || (f === t) ||
                 (f === 'none' && rows[i].dataset.sel === '0');
      rows[i].style.display = show ? '' : 'none';
    }
    function countIn(el){
      var n = 0, rs = el.children;
      for(var j = 0; j < rs.length; j++){ if(rs[j].style.display !== 'none') n++; }
      return n;
    }
    gInfer.style.display = countIn(listInfer) ? '' : 'none';
    gNone.style.display  = countIn(listNone)  ? '' : 'none';
  }

  for(var i = 0; i < chipEls.length; i++){
    chipEls[i].addEventListener('click', function(){
      for(var j = 0; j < chipEls.length; j++) chipEls[j].classList.remove('on');
      this.classList.add('on');
      applyRemedyFilter();
    });
  }

  document.getElementById('scroll').addEventListener('click', function(e){
    var ck = e.target.closest('.ck');
    if(!ck) return;
    var row = ck.parentNode;
    var on = !ck.classList.contains('on');
    ck.classList.toggle('on', on);
    ck.textContent = on ? '✓' : '';
    row.dataset.sel = on ? '1' : '0';
    if(currentFilter() === 'none' || currentFilter() === 'infer') applyRemedyFilter();
  });

  rng.addEventListener('input', function(){
    var v = Math.abs(parseInt(rng.value, 10));
    var base = N_INFER;
    var add = Math.round((60 - v) / 60 * 24);
    cntEl.textContent = base + add;
  });

  applyBtn.addEventListener('click', function(){
    var sel = document.querySelectorAll('#scroll .item[data-sel="1"]');
    var n = 0;
    for(var i = 0; i < sel.length; i++){
      if(sel[i].style.display !== 'none') n++;
    }
    var old = applyBtn.textContent;
    applyBtn.textContent = '已写入本地索引（' + n + ' 条示例）';
    setTimeout(function(){ applyBtn.textContent = old; }, 1400);
  });

  /* ---------- 提醒条：关一次就不再提醒；这批数量变了会重新提醒 ---------- */
  var TRIP = getTrip(q('trip'));
  var N_TOTAL = TRIP.missing || 0;
  var N_VID   = Math.round(N_TOTAL * 0.1);
  var N_PHO   = N_TOTAL - N_VID;
  var N_NONE  = Math.round(N_TOTAL * 0.104);
  var N_INFER = N_TOTAL - N_NONE;

  document.getElementById('rMeta').textContent = TRIP.name + ' · ' + N_TOTAL + ' 张待处理';
  document.getElementById('cAll').textContent = N_TOTAL;
  document.getElementById('cPhoto').textContent = N_PHO;
  document.getElementById('cVideo').textContent = N_VID;
  document.getElementById('cNone').textContent = N_NONE;
  document.getElementById('base').textContent = N_INFER;
  document.getElementById('cnt').textContent = N_INFER + 24;
  applyBtn.textContent = '采纳 ' + N_INFER + ' 张建议位置';

  var TIP_KEY = 'tripnest.tipNoGeo.' + TRIP.id;
  var BATCH = String(N_TOTAL);

  /* 没有缺坐标的行程：整页换成空态 */
  if(!N_TOTAL){
    var sc0 = document.getElementById('scroll');
    sc0.innerHTML = '<div class="empty">这次行程的素材都有坐标<br>不需要补救</div>';
    document.querySelector('.banner').style.display = 'none';
    document.getElementById('chips').style.display = 'none';
    document.querySelector('.footer').style.display = 'none';
  }
  var banner = document.getElementById('banner');
  try{
    if(localStorage.getItem(TIP_KEY) === BATCH) banner.style.display = 'none';
  }catch(err){}
  document.getElementById('tipx').addEventListener('click', function(){
    banner.style.display = 'none';
    try{ localStorage.setItem(TIP_KEY, BATCH); }catch(err){}
  });

  /* ---------- 大图模式（共享组件 lightbox.js） ---------- */
  var lbRow = null;


  function openLB(row, grad, label, sc){
    lbRow = row;
    var nm = label.split('  ·  ')[0];
    var pid = 'rmd-' + nm;
    Lightbox.open({
      sc: sc || 'sc6',
      ar: '3 / 2',
      meta: {date: label.split('  ·  ')[1] || '', place: label.split('  ·  ')[2] || '', suffix: nm},
      metaKey: 'remedy:' + TRIP.id + ':' + nm,
      noteKey: 'remedy:' + TRIP.id + ':' + nm,
      feat: {
        on: isFeatured(TRIP.id, pid),
        toggle: function(){ return toggleFeatured(TRIP.id, {id: pid, sc: sc || 'sc6'}).some(function(x){ return x.id === pid; }); }
      },
      isCover: (function(){ var c = coverOf(TRIP.id); return !!(c && c.id === pid); })(),
      cover: function(){ setCover(TRIP.id, {id: pid, sc: sc || 'sc6'}); },
      onDelete: function(){
        if(lbRow && lbRow.parentNode) lbRow.parentNode.removeChild(lbRow);
        applyRemedyFilter();
      }
    });
  }



  /* ---------- 单张设置坐标 ---------- */
  var modal = document.getElementById('modal');
  var mmap = document.getElementById('mmap');
  var mpin = document.getElementById('mpin');
  var mfile = document.getElementById('mfile');
  var mcoord = document.getElementById('mcoord');
  var curRow = null, curLL = null;

  /* 常用地点：正式版由腾讯位置服务的搜索接口返回，这里先内置几条演示 */
  var PLACES = [
    {n:'大理古城', lat:25.60, lng:100.16},
    {n:'洱海东岸', lat:25.75, lng:100.20},
    {n:'双廊',    lat:25.90, lng:100.26},
    {n:'喜洲',    lat:25.85, lng:100.12},
    {n:'挖色',    lat:25.65, lng:100.30},
    {n:'沙溪古镇', lat:26.15, lng:99.85}
  ];

  function dropPin(lat, lng){
    var r = mmap.getBoundingClientRect();
    curLL = {lat: lat, lng: lng};
    mpin.style.left = ((lng - 99.8) / 1.0 * r.width) + 'px';
    mpin.style.top = ((26.2 - lat) / 1.2 * r.height) + 'px';
    mpin.classList.add('show');
    mcoord.textContent = lat.toFixed(4) + '°N  ' + lng.toFixed(4) + '°E';
    showNearby(lat, lng);
  }

  /* 反查地名：正式版用腾讯位置服务的逆地理编码，这里用内置点做最近匹配 */
  function showNearby(lat, lng){
    var el = document.getElementById('mnear');
    if(!el) return;
    var best = null, bestD = 1e9;
    PLACES.forEach(function(p){
      var d = Math.pow(p.lat - lat, 2) + Math.pow(p.lng - lng, 2);
      if(d < bestD){ bestD = d; best = p; }
    });
    if(best && bestD < 0.0016){
      el.textContent = '附近：' + best.n;
    } else {
      el.textContent = '附近暂无地名';
    }
  }

  function openPicker(row, name){
    curRow = row; curLL = null;
    mfile.textContent = name;
    mcoord.textContent = '未设置';
    mpin.classList.remove('show');
    document.getElementById('mnear').textContent = '';
    var box = document.getElementById('msearch');
    if(box) box.value = '';
    document.getElementById('mres').classList.remove('show');
    modal.classList.add('show');
  }
  function closePicker(){ modal.classList.remove('show'); }

  mmap.addEventListener('click', function(e){
    var r = mmap.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var lat = 26.2 - (y / r.height) * 1.2;
    var lng = 99.8 + (x / r.width) * 1.0;
    curLL = {lat: lat, lng: lng};
    mpin.style.left = x + 'px';
    mpin.style.top = y + 'px';
    mpin.classList.add('show');
    mcoord.textContent = lat.toFixed(4) + '°N  ' + lng.toFixed(4) + '°E';
  });

  /* 搜索地点：输入即筛选，点选后落点 */
  var msearch = document.getElementById('msearch');
  var mres = document.getElementById('mres');

  msearch.addEventListener('input', function(){
    var kw = this.value.trim();
    if(!kw){ mres.classList.remove('show'); return; }
    var hit = PLACES.filter(function(p){ return p.n.indexOf(kw) >= 0; });
    mres.innerHTML = hit.map(function(p, i){
      return '<div data-i="' + PLACES.indexOf(p) + '">' + p.n + '</div>';
    }).join('');
    mres.classList.toggle('show', hit.length > 0);
  });

  mres.addEventListener('click', function(e){
    var d = e.target.closest('div');
    if(!d) return;
    var p = PLACES[+d.dataset.i];
    if(!p) return;
    msearch.value = p.n;
    mres.classList.remove('show');
    dropPin(p.lat, p.lng);
  });

  document.getElementById('mclose').addEventListener('click', closePicker);
  document.getElementById('mcancel').addEventListener('click', closePicker);
  document.getElementById('mok').addEventListener('click', function(){
    var row = curRow;
    if(!row || !curLL){ closePicker(); return; }

    var sub = row.querySelector('.meta .s');
    sub.innerHTML = '已设置 · ' + curLL.lat.toFixed(3) + '°N ' + curLL.lng.toFixed(3) + '°E';
    row.dataset.sel = '1';
    closePicker();

    /* 坐标补好后这张照片就不再是「待补救」，直接离开队列进入相册 */
    setTimeout(function(){
      if(row && row.parentNode) row.parentNode.removeChild(row);
      applyRemedyFilter();
      Lightbox.toast('已补好坐标，移入相册');
    }, 260);
  });


  /* 列表行：点缩略图看大图，点「采纳 / 手动打点」设坐标 */
  document.getElementById('scroll').addEventListener('click', function(e){
    if(e.target.closest('.ck')) return;
    var row = e.target.closest('.item');
    if(!row) return;
    var name = row.querySelector('.meta .f').textContent;
    var grad = row.querySelector('.thumb').style.background;

    var act = e.target.closest('.act');
    if(act){
      /* 一律进地图选点：底部已有一键采纳，逐行的按钮用来「改」而不是「收」 */
      openPicker(row, name);
      return;
    }
    if(e.target.closest('.thumb')){
      var s = row.querySelector('.meta .s').textContent;
      openLB(row, grad, name + '  ·  ' + s);
    }
  });

  applyRemedyFilter();
})();
</script>
<script src="nav.js"></script>
<script src="statusbar.js"></script>
</body>
</html>
